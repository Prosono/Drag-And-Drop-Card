<article class="hc sauna" data-hads-card>
  <img class="sauna-background" data-background src="__SAUNA_IMAGE__" alt="" aria-hidden="true" referrerpolicy="no-referrer">
  <div class="sauna-wash" aria-hidden="true"></div>
  <div class="sauna-content">
    <header class="sauna-header">
      <div class="sauna-brand"><img data-logo class="sauna-logo" alt="" hidden referrerpolicy="no-referrer"><svg data-brand-symbol class="sauna-symbol" viewBox="0 0 40 40" aria-hidden="true"><path d="M10 27h20M8 32h24M12 22c-7-8 9-8 2-17m6 17c-7-8 9-8 2-17m6 17c-7-8 9-8 2-17"/></svg><span data-title></span></div>
      <div class="sauna-top-right"><div data-datetime class="sauna-datetime"><time data-clock></time><time data-date></time></div><button class="hc-settings" data-settings type="button" aria-label="Innstillinger"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg></button></div>
    </header>
    <main class="hc-body sauna-main">
      <div class="sauna-welcome"><span class="sauna-eyebrow" data-kicker></span><h1><span data-welcome></span><span data-guest></span></h1><p data-subtitle></p></div>
      <section class="sauna-readings" aria-label="Badstuens målinger">
        <button class="sauna-temperature" data-temperature-button type="button"><span class="sauna-label" data-temperature-label></span><span class="sauna-temperature-value"><b data-temperature>—</b><span data-temperature-unit></span></span><small data-measurement-state></small></button>
        <button class="sauna-extra" data-extra="1" type="button"><span class="sauna-label" data-extra-label="1"></span><span class="sauna-extra-reading"><b data-extra-value="1">—</b><small data-extra-unit="1"></small></span></button>
        <button class="sauna-extra" data-extra="2" type="button"><span class="sauna-label" data-extra-label="2"></span><span class="sauna-extra-reading"><b data-extra-value="2">—</b><small data-extra-unit="2"></small></span></button>
      </section>
    </main>
    <footer class="sauna-footer"><span data-connect></span><span data-updated></span><button data-configure type="button" class="sauna-setup"></button></footer>
  </div>
  <section data-empty hidden><span data-empty-title></span><span data-empty-text></span></section>
  <div class="hc-message" data-message role="status" aria-live="polite" hidden></div>
  <dialog aria-labelledby="sauna-settings-title"><form><header><h2 id="sauna-settings-title" data-dialog-title></h2><button type="button" data-close aria-label="Lukk">×</button></header><p class="hc-dialog-hint" data-dialog-hint></p><div class="hc-fields" data-fields></div><footer><button type="button" class="hc-action" data-cancel></button><button type="submit" class="hc-action primary" data-save></button></footer></form></dialog>
</article>
