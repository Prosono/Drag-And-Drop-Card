<div class="cover-layout">
  <div class="cover-scene" aria-hidden="true">
    <span class="cover-sun"></span><div class="cover-horizon"></div>
    <div class="cover-window"><i class="window-cross"></i><div class="cover-fabric"></div><div class="curtain left"></div><div class="curtain right"></div><span class="window-handle"></span></div>
    <div class="cover-sill"></div><div class="cover-plant"><i></i><i></i><i></i><b></b></div>
    <span class="scene-label">HADS / 01</span>
  </div>
  <section class="cover-controls">
    <div class="cover-reading"><div><span class="hc-caption" data-position-label></span><strong data-cover-value>—</strong></div><span class="cover-status"><i></i><span data-cover-state></span></span></div>
    <button type="button" class="cover-entity" data-cover-details><span data-cover-label></span><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
    <div class="cover-buttons">
      <button type="button" class="hc-action" data-open><svg viewBox="0 0 24 24"><path d="m5 15 7-7 7 7"/></svg><span data-open-label></span></button>
      <button type="button" class="hc-action" data-stop><svg viewBox="0 0 24 24"><path d="M8 6v12M16 6v12"/></svg><span data-stop-label></span></button>
      <button type="button" class="hc-action" data-shut><svg viewBox="0 0 24 24"><path d="m5 9 7 7 7-7"/></svg><span data-shut-label></span></button>
    </div>
    <label class="cover-slider" data-position-field><input class="hc-range" type="range" min="0" max="100" step="1" data-position><span class="range-ends"><span>0%</span><span>100%</span></span></label>
    <label class="cover-slider" data-tilt-field><span class="range-ends"><span data-tilt-label></span><span data-tilt-value></span></span><input class="hc-range" type="range" min="0" max="100" step="1" data-tilt></label>
    <p class="hc-caption cover-note" data-cover-note></p>
  </section>
</div>
